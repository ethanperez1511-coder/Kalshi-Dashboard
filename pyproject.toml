[project]
name = "kalshi-dashboard"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=43.0.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# Live tests hit real external APIs and need credentials. They are excluded
# from the default run so a machine without secrets still gets a green suite —
# but they are NOT allowed to skip themselves into invisibility. The scheduled
# live-checks workflow runs `-m live` WITH credentials, where missing creds are
# a hard failure, and tests/test_live_suite_wiring.py asserts that this whole
# arrangement still exists and is wired to CI.
addopts = "-m 'not live'"
markers = [
    "live: hits real external APIs; run by the scheduled live-checks workflow",
]
