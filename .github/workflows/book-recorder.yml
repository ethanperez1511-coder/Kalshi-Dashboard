name: book-recorder

# Records the orderbook delta feed. Runs hourly for ~55 minutes, so coverage is
# near-continuous without a long-lived process to run out of resources — the
# failure mode that killed the Railway host.
#
# Kalshi serves NO historical book. The trade tape reaches back ~60 days, the
# book reaches back zero, so this cannot be backfilled: a day not recorded is a
# day of validation window that never exists. That is why it runs before the
# simulator that consumes it.
on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch: {}

concurrency:
  group: book-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Record book feed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY_B64 }}
        run: python -m src.recorder --duration 3300
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m src.alert_live_failure
