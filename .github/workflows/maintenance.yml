name: maintenance

# One-shot operations, dispatched deliberately. Never scheduled: a maintenance
# job that can close positions on a timer is a trading strategy nobody
# approved.
#
# Run it with no input first — that is a dry run and writes the full production
# trade record to the run summary. Only re-run with the exact confirmation
# token once the report has been read.
#
# Two actions, two tokens, on purpose:
#   retire_sha blank + CLOSE-LEGACY-POSITIONS -> unwind legacy positions
#   retire_sha set   + RETIRE-DEPLOY-SHA      -> retire a deploy from the gate
#   purge_markets    + PURGE-ORPHAN-MARKETS   -> delete dependency-free rows
#   vacuum_full      + VACUUM-FULL-TAPE       -> rewrite pruned tables, return space
#   shrink_tape      + SHRINK-TAPE            -> measure tape; shrink it in place
#   clear-halt       + CLEAR-HALT             -> release latched kill-switch halts
#   wipe_void_shadow + WIPE-VOID-SHADOW       -> delete pre-rebuild shadow rows
# One token for both would mean confirming either confirms both.
#
# db_stats is the exception and takes no token: it is SELECT-only. It is
# checked FIRST so it can never be combined with a destructive input.
on:
  workflow_dispatch:
    inputs:
      # One action per dispatch. A choice list rather than a checkbox per
      # action: the checkboxes had reached GitHub's input limit, and a choice
      # cannot select two destructive actions at once.
      action:
        description: "What to run. Read-only actions ignore confirm; the others dry-run unless confirm carries their exact token."
        type: choice
        required: true
        default: db-stats
        options:
          - db-stats            # read-only census
          - pending-matches     # read-only: Polymarket review queue
          - day7                # read-only: trade-through measurement
          - clear-halt          # lists latched halts; CLEAR-HALT clears them
          - wipe-void-shadow    # WIPE-VOID-SHADOW
          - shrink-tape         # measurement; SHRINK-TAPE shrinks (see max_chunks)
          - vacuum-full         # VACUUM-FULL-TAPE
          - purge-markets       # PURGE-ORPHAN-MARKETS
          - retire-deploy       # needs retire_sha; RETIRE-DEPLOY-SHA
          - legacy-positions    # CLOSE-LEGACY-POSITIONS
      confirm:
        description: "The action's exact token (CLEAR-HALT, WIPE-VOID-SHADOW, SHRINK-TAPE, VACUUM-FULL-TAPE, PURGE-ORPHAN-MARKETS, RETIRE-DEPLOY-SHA, CLOSE-LEGACY-POSITIONS). Blank = dry run."
        required: false
        default: ""
      retire_sha:
        description: "retire-deploy only: the deploy SHA to retire (e.g. e807f8dd)."
        required: false
        default: ""
      max_chunks:
        description: "shrink-tape only: stop after N chunks of 20,000 rows (an installment, no reindex). Blank = to completion."
        required: false
        default: ""

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Census, reconcile or retire (acts only if confirmed)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY_B64 }}
          ACTION: ${{ inputs.action }}
          RETIRE_SHA: ${{ inputs.retire_sha }}
          CONFIRM: ${{ inputs.confirm }}
          MAX_CHUNKS: ${{ inputs.max_chunks }}
        # Inputs go through the environment, never interpolated into the shell
        # command: a workflow_dispatch input is attacker-controlled text and
        # "${{ inputs.x }}" inside `run:` is a shell injection.
        run: |
          case "$ACTION" in
            db-stats)          python -m src.maintenance --db-stats ;;
            pending-matches)   python -m src.maintenance --pending-matches ;;
            day7)              python -m src.execution.day7 ;;
            clear-halt)        python -m src.maintenance --clear-halt --confirm "$CONFIRM" ;;
            wipe-void-shadow)  python -m src.maintenance --wipe-void-shadow --confirm "$CONFIRM" ;;
            shrink-tape)
              if [ -n "$MAX_CHUNKS" ]; then
                python -m src.maintenance --shrink-tape --confirm "$CONFIRM" --max-chunks "$MAX_CHUNKS"
              else
                python -m src.maintenance --shrink-tape --confirm "$CONFIRM"
              fi ;;
            vacuum-full)       python -m src.maintenance --vacuum-full --confirm "$CONFIRM" ;;
            purge-markets)     python -m src.maintenance --purge-markets --confirm "$CONFIRM" ;;
            retire-deploy)     python -m src.maintenance --retire-sha "$RETIRE_SHA" --confirm "$CONFIRM" ;;
            legacy-positions)  python -m src.maintenance --confirm "$CONFIRM" ;;
            *) echo "unknown action: $ACTION" >&2; exit 2 ;;
          esac
