name: maintenance

# One-shot operations, dispatched deliberately. Never scheduled: a maintenance
# job that can close positions on a timer is a trading strategy nobody
# approved.
#
# Run it with no input first — that is a dry run and writes the full production
# trade record to the run summary. Only re-run with the exact confirmation
# token once the report has been read.
#
# Two actions, two tokens, on purpose:
#   retire_sha blank + CLOSE-LEGACY-POSITIONS -> unwind legacy positions
#   retire_sha set   + RETIRE-DEPLOY-SHA      -> retire a deploy from the gate
#   purge_markets    + PURGE-ORPHAN-MARKETS   -> delete dependency-free rows
#   vacuum_full      + VACUUM-FULL-TAPE       -> rewrite pruned tables, return space
#   shrink_tape      + SHRINK-TAPE            -> measure tape; shrink it in place
#   wipe_void_shadow + WIPE-VOID-SHADOW       -> delete pre-rebuild shadow rows
# One token for both would mean confirming either confirms both.
#
# db_stats is the exception and takes no token: it is SELECT-only. It is
# checked FIRST so it can never be combined with a destructive input.
on:
  workflow_dispatch:
    inputs:
      db_stats:
        description: "Read-only DB census — table sizes, market statuses, growth rates. Ignores the other two inputs."
        type: boolean
        required: false
        default: false
      pending_matches:
        description: "Read-only: list Polymarket pairs awaiting review (verdicts go in match_seed.py). Ignores the other inputs."
        type: boolean
        required: false
        default: false
      day7:
        description: "Read-only: day-7 trade-through measurement per category (live rows only). Ignores the other inputs."
        type: boolean
        required: false
        default: false
      purge_markets:
        description: "Purge market rows with zero dependent data, archive the rest. Dry run unless confirm=PURGE-ORPHAN-MARKETS."
        type: boolean
        required: false
        default: false
      vacuum_full:
        description: "Rewrite the pruned tables to return freed space to Neon (exclusive lock). Dry run unless confirm=VACUUM-FULL-TAPE."
        type: boolean
        required: false
        default: false
      shrink_tape:
        description: "Measure the tape table (sizes, rate, steady state). With confirm=SHRINK-TAPE, shrink it in place in chunks."
        type: boolean
        required: false
        default: false
      wipe_void_shadow:
        description: "Delete the shadow rows written before the 2026-10-06 rebuild (void). Dry run unless confirm=WIPE-VOID-SHADOW."
        type: boolean
        required: false
        default: false
      max_chunks:
        description: "With shrink_tape: stop after N chunks of 20,000 rows (an installment, no reindex). Blank = run to completion."
        required: false
        default: ""
      retire_sha:
        description: "Deploy SHA to retire from the gate (e.g. e807f8dd). Blank = legacy-position reconcile instead."
        required: false
        default: ""
      confirm:
        description: "CLOSE-LEGACY-POSITIONS to unwind, RETIRE-DEPLOY-SHA to retire a deploy, PURGE-ORPHAN-MARKETS to purge, VACUUM-FULL-TAPE to vacuum, SHRINK-TAPE to shrink, WIPE-VOID-SHADOW to wipe. Blank for a dry run."
        required: false
        default: ""

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Census, reconcile or retire (acts only if confirmed)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY_B64 }}
          DB_STATS: ${{ inputs.db_stats }}
          DAY7: ${{ inputs.day7 }}
          PENDING_MATCHES: ${{ inputs.pending_matches }}
          PURGE_MARKETS: ${{ inputs.purge_markets }}
          VACUUM_FULL: ${{ inputs.vacuum_full }}
          SHRINK_TAPE: ${{ inputs.shrink_tape }}
          MAX_CHUNKS: ${{ inputs.max_chunks }}
          WIPE_VOID_SHADOW: ${{ inputs.wipe_void_shadow }}
          RETIRE_SHA: ${{ inputs.retire_sha }}
          CONFIRM: ${{ inputs.confirm }}
        # Inputs go through the environment, never interpolated into the shell
        # command: a workflow_dispatch input is attacker-controlled text and
        # "${{ inputs.x }}" inside `run:` is a shell injection.
        run: |
          if [ "$DB_STATS" = "true" ]; then
            python -m src.maintenance --db-stats
          elif [ "$DAY7" = "true" ]; then
            python -m src.execution.day7
          elif [ "$PENDING_MATCHES" = "true" ]; then
            python -m src.maintenance --pending-matches
          elif [ "$PURGE_MARKETS" = "true" ]; then
            python -m src.maintenance --purge-markets --confirm "$CONFIRM"
          elif [ "$VACUUM_FULL" = "true" ]; then
            python -m src.maintenance --vacuum-full --confirm "$CONFIRM"
          elif [ "$WIPE_VOID_SHADOW" = "true" ]; then
            python -m src.maintenance --wipe-void-shadow --confirm "$CONFIRM"
          elif [ "$SHRINK_TAPE" = "true" ]; then
            if [ -n "$MAX_CHUNKS" ]; then
              python -m src.maintenance --shrink-tape --confirm "$CONFIRM" --max-chunks "$MAX_CHUNKS"
            else
              python -m src.maintenance --shrink-tape --confirm "$CONFIRM"
            fi
          elif [ -n "$RETIRE_SHA" ]; then
            python -m src.maintenance --retire-sha "$RETIRE_SHA" --confirm "$CONFIRM"
          else
            python -m src.maintenance --confirm "$CONFIRM"
          fi
