name: live-checks

# Tests that hit real external APIs. Excluded from the default suite (which
# must stay green without secrets), so they need somewhere to actually run —
# otherwise marking them is indistinguishable from deleting them.
#
# Missing credentials here are a FAILURE, not a skip. These tests exist to
# catch upstream contracts changing under us: a Kalshi series repointed at a
# different settlement station would price a whole city against the wrong
# observation, and nothing in the local suite can see that.
on:
  schedule:
    - cron: "17 13 * * *"   # daily, after the US morning CLI products post
  workflow_dispatch: {}

concurrency:
  group: live-checks
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[dev]"
      # Collection-level guard first. On 2026-10-10/11 an undeclared import
      # (yaml) broke collection with exit code 2, so the live suite never ran
      # and the page claimed a contract change. This names the cause instead.
      - name: Every import is a declared dependency
        run: python -m pytest tests/test_declared_dependencies.py -m "not live" -q
      - name: Run live suite
        id: live
        env:
          # Read-only market data. None of these enable live trading — `mode`
          # lives in the DB and defaults to paper.
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY_B64 }}
        # The exit code decides the page: 1 = a check failed (contract
        # warning); anything else = the suite never ran (nothing verified).
        run: |
          set +e
          python -m pytest -m live -v
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # A scheduled guard that fails quietly in Actions is the same bug as a
      # test that skips itself: something is watching, nothing is watched. The
      # failure has to reach a phone.
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_KIND: live-checks
          LIVE_EXIT: ${{ steps.live.outputs.code }}
        run: python -m src.alert_live_failure
