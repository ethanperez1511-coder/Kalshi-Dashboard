name: session-watchdog

# A session that never starts is silent: no cycle runs, so no cycle fails and no
# digest goes out. This asks GitHub (not Neon) whether a session link is running
# inside the window, and alerts on Telegram if not. Three triggers, because the
# watchdog's own cron can be dropped like any other.
#
# It also re-enables every workflow, so GitHub's 60-day inactivity rule never
# switches the schedules off (a disabled workflow cannot re-enable itself).
on:
  schedule:
    - cron: "5 16 * * *"
    - cron: "35 16 * * *"
    - cron: "5 17 * * *"
  workflow_dispatch: {}

concurrency:
  group: session-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  actions: write      # read runs; enable workflows

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Check the session; keep workflows enabled
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.session_watchdog
