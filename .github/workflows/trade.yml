name: paper-trade-cycle

# Runs ONE pipeline cycle, on demand. Scheduled cycles now run inside the daily
# market session (session.yml). State lives in Neon Postgres (DATABASE_URL secret).
on:
  # BACKSTOP (L32, ruling 2026-10-06). Cycles run inside the daily market
  # session (session.yml), but the session's own triggers did not fire on its
  # first day. This schedule stays until the exit criterion in tasks/todo.md
  # is met: 7 consecutive green session days with the watchdog green. It is
  # removed in its own commit. Overlap is safe: the cycle lock in the database
  # makes a backstop cycle that meets a session cycle skip, green, untouched.
  schedule:
    - cron: "*/15 * * * *"  # every 15 min — see TRADING_CYCLE_MINUTES
  workflow_dispatch: {}

# One cycle at a time. Never cancel a running cycle mid-trade (would risk a partial
# write / double-execution against the single-writer Postgres DB). Extra ticks queue.
concurrency:
  group: paper-trade-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # under the 15-min interval, so a hung cycle cannot queue the next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      # Schema changes are applied here, as their own deliberate step. Neither
      # the pipeline nor the dashboard migrates on startup — they report a stale
      # schema and refuse. Additive-only and idempotent, so a no-op run costs
      # one query.
      - name: Apply pending schema migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.migrate
      - name: Run one paper-trading cycle
        env:
          # Data-only secrets. NONE of these enable live mode — `mode` lives in the
          # DB and defaults to 'paper'. Live requires a deliberate human DB change.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          # base64 of the PEM — load_private_key_from_string() decodes it (dodges the
          # literal-\n corruption hit on Railway, commit 7d35af5).
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY_B64 }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Operator-settable configuration, as repository VARIABLES rather than
          # secrets: these are settings, not credentials, and a value nobody can
          # read back is a value nobody can verify was set.
          #
          # An unset variable renders as an EMPTY STRING, and the environment
          # variable is then present-and-empty rather than absent. That emptied
          # TRADING_EXCLUDED_SERIES for a full day on 2026-08-17 and uncapped
          # the parlay firehose — the comment here previously claimed absence
          # changed nothing, which was true of _env_bool and false of _env_str.
          # _env_str now treats empty as absent, so both are safe.
          #
          # Neither flag can enable live trading — `mode` lives in the DB and
          # the live gate is untouched by both.
          #
          # Passed here because they were NOT before: both are read from the
          # environment by trading_config, so setting the repository variable
          # would have silently done nothing at all.
          TRADING_SHADOW_MAKER_ENABLED: ${{ vars.TRADING_SHADOW_MAKER_ENABLED }}
          TRADING_EXCLUDED_SERIES: ${{ vars.TRADING_EXCLUDED_SERIES }}
          # Dead-man's switch: pinged after each successful cycle. A URL, not
          # a credential; unset renders empty, which means "no ping".
          DEADMAN_PING_URL: ${{ secrets.DEADMAN_PING_URL }}
        run: python -m src.run_trading   # single cycle (NO --loop)
